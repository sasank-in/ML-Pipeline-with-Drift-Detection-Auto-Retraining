[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-trigger-ml-pipeline"
version = "0.1.0"
description = "Real-time ML pipeline with drift detection and auto-retraining"
requires-python = ">=3.9"
readme = "README.md"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "ml*", "services*", "registry*", "dashboards*"]
exclude = ["tests*", "data*", "models*", "logs*", "mlruns*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
